name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Required permissions for test reporting
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  SOLUTION_FILE: 'PwrSvg.sln'

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Build for .NET 8.0
      run: dotnet build ${{ env.SOLUTION_FILE }} -c Release -f net8.0 --no-restore
      
    - name: Build for .NET Framework 4.8 (Windows only)
      if: matrix.os == 'windows-latest'
      run: dotnet build PwrSvg/PwrSvg.csproj -c Release -f net48 --no-restore
      
    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --no-build -c Release --verbosity normal
      
    - name: Install Sixel (PowerShell 7)
      shell: pwsh
      run: Install-Module -Name Sixel -Scope CurrentUser -Force

    - name: Install Sixel (Windows PowerShell)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
        Install-Module -Name Sixel -Scope CurrentUser -Force

    - name: Build module layout
      shell: pwsh
      run: ./build/New-ModuleLayout.ps1 -OutputPath ./artifacts

    - name: Run Pester integration tests (PowerShell 7)
      shell: pwsh
      run: ./.github/scripts/Run-PesterCI.ps1 -ModulePath ./artifacts/PwrSvg

    - name: Run Pester integration tests (Windows PowerShell)
      if: runner.os == 'Windows'
      shell: powershell
      run: ./.github/scripts/Run-PesterCI.ps1 -ModulePath ./artifacts/PwrSvg

    - name: Publish Pester test results
      uses: dorny/test-reporter@v1.9.1
      if: always()
      with:
        name: Pester integration tests (${{ matrix.os }})
        path: 'pester-results-*.xml'
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false
        max-annotations: 10
